<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ⚠ FAVICON SOURCE ONLY — deliberately NOT the same art as `icon.svg`.
       A browser tab renders this at 16px. `icon.svg` puts a $ AND an open book
       inside a black medallion, which is right for a 192px home-screen icon and
       turns to grey mush at tab size: the marks end up ~7px across. So the tab
       gets the one glyph the brand owns outright, at the largest size that still
       leaves the amber ring readable, and drops the book entirely.

       Keep the two in sync on COLOUR and SHAPE LANGUAGE, never on detail. If you
       find yourself adding anything to this file, render it at 16px first. -->
  <rect width="512" height="512" rx="112" fill="#fbbf24"/>
  <circle cx="256" cy="256" r="212" fill="#000000"/>
  <text x="256" y="262"
    font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace"
    font-weight="800" font-size="392" text-anchor="middle"
    dominant-baseline="central"
    fill="#fbbf24"
  >$</text>
</svg>
